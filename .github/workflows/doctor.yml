name: Revisar fuentes

# Los medios mueven sus feeds y rediseñan sus paginas sin avisar. Esta revision
# semanal avisa antes de que una fuente lleve un mes sin publicar nada.
on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
    inputs:
      fuentes:
        description: "Claves separadas por coma (vacio = todas)"
        type: string
        default: ""
      detalle:
        description: "Contar el codigo HTTP real de cada fallo y el JSON incrustado"
        type: boolean
        default: false
      probar:
        description: "URLs sueltas separadas por coma: solo mira que contestan"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Pasar revision
        id: revision
        continue-on-error: true
        run: |
          set -o pipefail
          args=(doctor --salida doctor.txt --ignorar-robots)
          [ -n "${{ inputs.fuentes }}" ] && args+=(--fuentes "${{ inputs.fuentes }}")
          [ "${{ inputs.detalle }}" = "true" ] && args+=(--detalle)
          [ -n "${{ inputs.probar }}" ] && args+=(--probar "${{ inputs.probar }}")
          python -m scraper "${args[@]}"

      - name: Publicar el informe
        if: always()
        run: |
          {
            echo "## Estado de las fuentes"
            echo
            echo '```'
            cat doctor.txt 2>/dev/null || echo "La revision no produjo informe."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fallar si alguna fuente esta caida
        if: steps.revision.outcome == 'failure'
        run: |
          echo "Hay fuentes caidas: mira el informe de arriba." >&2
          exit 1
